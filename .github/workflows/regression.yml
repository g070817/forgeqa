name: regression

# 加引号是为了让 PyYAML 等 YAML 1.1 解析器不把 on 当成布尔键（GitHub 本身两种都接受）
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------- 单元测试
  unit:
    name: 单元测试 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: 单元测试
        run: pytest tests -q

  # ------------------------------------------------- 端到端回归（内置演示站点）
  # 这里用仓库内置的 Flask 演示站点做真实闭环：造数 → 接口 → 查库 → UI → 断言 → 清理。
  # 接自己的站点时，把「启动演示站点」换成拉起被测系统即可，其余步骤不变。
  e2e:
    name: 端到端回归 · 内置演示站点
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: 安装浏览器内核
        run: python -m playwright install --with-deps chromium

      # 起服务与跑回归必须在同一步：跨步骤的后台进程会被 runner 回收。
      # trap 保证无论成功失败都收掉服务，不留野进程占用端口。
      - name: 启动演示站点并执行回归
        run: |
          set -uo pipefail

          python examples/demo_server.py --port 8000 > /tmp/demo.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:8000/health > /dev/null; then
            echo "::error::演示站点启动失败"
            cat /tmp/demo.log
            exit 1
          fi
          echo "演示站点已就绪"

          # 基线未入库（out/ 被忽略），首次运行需 update 写入基线。
          # 若要启用基线漂移检测：把 out/baselines 纳入版本控制，并把下面改成 --baseline diff。
          forgeqa run --cases cases --baseline update --report-dir out/reports

      - name: 上传报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgeqa-report
          path: |
            out/reports/
            /tmp/demo.log
          if-no-files-found: warn
          retention-days: 14
