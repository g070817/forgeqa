default_env: local
defaults:
  http:
    timeout: 15
    retries: 2
    headers:
      User-Agent: forgeqa/1.0
      Accept: application/json
  ui:
    browser: chromium
    headless: true
    timeout: 15000
    viewport:
      width: 1440
      height: 900
    screenshot_on_fail: true
  db:
    driver: sqlite
    path: ./out/forgeqa.db
  auth:
    type: bearer
    scheme: Bearer
    token_var: ctx.token
    login:
      method: POST
      path: /api/login
      json:
        username: ${os:QA_USER:-admin}
        password: ${os:QA_PASS:-admin123}
      extract:
        token: $.data.token
        login_roles: $.data.roles
generators:
  locale: zh_CN
  seed: 20260922
  out_dir: ./out/data
runner:
  retries: 0
  repeat: 1
  jobs: 1
  fail_fast: false
report:
  out_dir: ./out/reports
  junit: true
hooks:
  ddl: config/db/schema.sql
  cleanup: true
  seed:
  - entity: dept
    schema: dept.yaml
    count: 3
    table: dept
    mapping:
      dept_no: dept_no
      name: name
      status: status
envs:
  local:
    base_url: http://127.0.0.1:8080
  staging:
    base_url: https://staging.example.com
    db:
      driver: mysql
      dsn: mysql+pymysql://qa:qa_pass@127.0.0.1:3306/appdb
  prod_readonly:
    base_url: https://www.example.com
    http:
      retries: 1
    db:
      driver: sqlite
      path: ./out/readonly.db
